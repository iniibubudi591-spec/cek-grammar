<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cek Grammar</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; margin: 0; padding: 12px; color: #222; background: #fff; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  details { border: 1px solid #d0d0d0; border-radius: 6px; padding: 8px; margin-bottom: 10px; }
  summary { cursor: pointer; font-weight: 600; }
  label { display: block; margin: 8px 0 3px; font-size: 12px; color: #555; }
  input[type=password], input[type=text], select { width: 100%; padding: 6px; border: 1px solid #bbb; border-radius: 4px; font-size: 13px; }
  label.cb { display: flex; gap: 6px; align-items: flex-start; color: #222; margin-top: 10px; }
  label.cb input { margin-top: 2px; }
  button { padding: 6px 10px; border: 1px solid #999; background: #f3f3f3; border-radius: 4px; cursor: pointer; font-size: 12px; }
  button:hover { background: #e6e6e6; }
  button:disabled { opacity: .5; cursor: default; }
  button.utama { width: 100%; background: #0f6cbd; color: #fff; border-color: #0f6cbd; padding: 9px; font-size: 14px; }
  button.utama:hover { background: #0c5a9e; }
  .baris { display: flex; gap: 6px; margin-top: 8px; }
  .kecil { font-size: 12px; color: #666; margin: 6px 0 10px; }
  #status { margin: 10px 0; padding: 8px; border-radius: 4px; display: none; white-space: pre-wrap; word-break: break-word; position: sticky; top: 0; z-index: 10; }
  #status.info { display: block; background: #eef5fc; border: 1px solid #c9ddf0; }
  #status.err { display: block; background: #fdecea; color: #8a1f11; border: 1px solid #f0c4be; }
  #status.ok { display: block; background: #eaf6ec; color: #1e5b2a; border: 1px solid #bfe0c6; }
  .kartu { border: 1px solid #d8d8d8; border-left: 4px solid #d9534f; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .kartu.selesai { opacity: .55; border-left-color: #999; }
  .jenis { display: inline-block; font-size: 11px; background: #f3e3e2; color: #8a1f11; padding: 1px 6px; border-radius: 10px; margin-bottom: 4px; }
  .salah { text-decoration: line-through; color: #b32d2e; }
  .saran { font-weight: 600; color: #1e7e34; }
  .alasan { margin: 4px 0 6px; color: #444; }
  .tombol { display: flex; gap: 6px; }
  .pesan { margin: 6px 0 0; font-size: 12px; }
</style>
</head>
<body>
<h1>Cek Grammar</h1>

<details id="setelan" open>
  <summary>Pengaturan</summary>
  <label for="prov">Penyedia</label>
  <select id="prov">
    <option value="gemini">Google (Gemini dan Gemma)</option>
    <option value="openai">OpenAI</option>
  </select>
  <label for="key">API key</label>
  <input id="key" type="password" autocomplete="off" placeholder="Tempel API key di sini">
  <label for="model">Model</label>
  <select id="model"></select>
  <label class="cb"><input type="checkbox" id="auto"> Pindah otomatis ke model lain kalau server sibuk</label>
  <div class="baris">
    <button id="simpan">Simpan</button>
    <button id="cari">Cari model</button>
  </div>
  <p class="kecil">API key disimpan di browser Word kamu, bukan di file ini. Gemma tidak mendukung format JSON paksa, jadi hasilnya bisa kurang rapi.</p>
</details>

<p class="kecil">Blok teks yang mau dicek. Kalau tidak ada yang diblok, yang dicek adalah paragraf tempat kursor berada. Maksimal 6000 karakter.</p>
<button id="cek" class="utama">Periksa</button>
<div id="status"></div>
<div id="aksi" style="display:none; margin-bottom:8px;">
  <button id="semua">Ganti semua</button>
</div>
<div id="hasil"></div>

<script>
var GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta/";
var OPENAI_BASE = "https://api.openai.com/v1/";
var MAX_CHARS = 6000;
var K_PROV = "gg_prov";
var K_AUTO = "gg_auto";
var DEFAULT_MODEL = { gemini: "gemini-2.5-flash", openai: "gpt-4o-mini" };
var KODE_SIBUK = [500, 502, 503, 504];
var KODE_PINDAH = [429, 500, 502, 503, 504];

var temuan = [];
var sibuk = false;
var provAktif = "gemini";

function $(id) { return document.getElementById(id); }
function kKey(p) { return "gg_key_" + p; }
function kModel(p) { return "gg_model_" + p; }
function kList(p) { return "gg_list_" + p; }
function simpanLokal(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function bacaLokal(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function tunggu(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function status(teks, jenis) {
  var el = $("status");
  el.className = jenis || "info";
  el.textContent = teks;
}

function atur(selectEl, nilai) {
  var ada = false;
  for (var i = 0; i < selectEl.options.length; i++) {
    if (selectEl.options[i].value === nilai) ada = true;
  }
  if (!ada) {
    var o = document.createElement("option");
    o.value = nilai; o.textContent = nilai;
    selectEl.appendChild(o);
  }
  selectEl.value = nilai;
}

function isiModel(list, pilih) {
  var sel = $("model");
  sel.innerHTML = "";
  list.forEach(function (n) {
    var o = document.createElement("option");
    o.value = n; o.textContent = n;
    sel.appendChild(o);
  });
  if (pilih) atur(sel, pilih);
}

function muatProv(p) {
  $("key").value = bacaLokal(kKey(p));
  var list = [];
  try { list = JSON.parse(bacaLokal(kList(p)) || "[]"); } catch (e) { list = []; }
  isiModel(list, bacaLokal(kModel(p)) || DEFAULT_MODEL[p]);
}

function simpanSaatIni() {
  simpanLokal(kKey(provAktif), $("key").value.trim());
  simpanLokal(kModel(provAktif), $("model").value);
  simpanLokal(K_AUTO, $("auto").checked ? "1" : "0");
  simpanLokal(K_PROV, provAktif);
}

Office.onReady(function (info) {
  var lamaKey = bacaLokal("gg_api_key");
  if (lamaKey && !bacaLokal(kKey("gemini"))) simpanLokal(kKey("gemini"), lamaKey);
  var lamaModel = bacaLokal("gg_model");
  if (lamaModel && !bacaLokal(kModel("gemini"))) simpanLokal(kModel("gemini"), lamaModel);

  provAktif = bacaLokal(K_PROV) || "gemini";
  $("prov").value = provAktif;
  $("auto").checked = bacaLokal(K_AUTO) !== "0";
  muatProv(provAktif);

  $("prov").onchange = function () {
    simpanSaatIni();
    provAktif = $("prov").value;
    muatProv(provAktif);
    simpanLokal(K_PROV, provAktif);
  };
  $("simpan").onclick = function () { simpanSaatIni(); status("Pengaturan disimpan.", "ok"); };
  $("cari").onclick = cariModel;
  $("cek").onclick = periksa;
  $("semua").onclick = gantiSemua;
  if (info.host !== Office.HostType.Word) status("Add-in ini dibuat untuk Word.", "err");
});

// ---------- Pemanggilan API ----------
function petunjuk(kode, data, raw) {
  var pesan = (data && data.error && data.error.message) || String(raw).slice(0, 300);
  var peta = {
    400: "Permintaan ditolak. Bisa karena API key salah, atau model tidak mendukung fitur yang diminta. Baca pesan server.",
    401: "API key salah atau tidak aktif.",
    403: "API key tidak punya izin, atau dibatasi.",
    404: "Nama model tidak ditemukan. Klik Cari model.",
    429: "Kuota atau saldo habis, atau terlalu banyak permintaan.",
    500: "Server bermasalah. Coba lagi nanti.",
    502: "Server bermasalah. Coba lagi nanti.",
    503: "Server sedang sibuk. Coba lagi nanti.",
    504: "Server terlalu lama membalas. Coba lagi nanti."
  };
  return "Kode " + kode + ". " + (peta[kode] || "") + "\nPesan server: " + pesan;
}

function galat(kode, data, raw) {
  var e = new Error(petunjuk(kode, data, raw));
  e.kode = kode;
  e.pesan = (data && data.error && data.error.message) || String(raw).slice(0, 300);
  return e;
}

function butuhTanpaJson(e) {
  return e && e.kode === 400 && /json mode|mime|schema|not enabled|not supported/i.test(e.pesan || "");
}

function bolehPindah(e) {
  if (KODE_PINDAH.indexOf(e.kode) >= 0 || e.kode === 404) return true;
  return e.kode === 400 && /models\//i.test(e.pesan || "");
}

async function kirim(url, opsi) {
  var res;
  try {
    res = await fetch(url, opsi);
  } catch (e) {
    throw new Error("Tidak bisa menjangkau server. Cek internet, VPN, proxy, atau firewall. Detail: " + e.message);
  }
  var raw = await res.text();
  var data = null;
  try { data = JSON.parse(raw); } catch (e) {}
  if (!res.ok) throw galat(res.status, data, raw);
  return data;
}

function buatPrompt(teks, bentuk) {
  var p =
    "Kamu editor bahasa yang teliti. Periksa teks di bawah untuk salah ketik, salah ejaan, salah tata bahasa, " +
    "pilihan kata yang kurang tepat, dan kalimat yang tidak efektif. Teks bisa berbahasa Indonesia atau Inggris. " +
    "Tulis \"saran\" dalam bahasa yang sama dengan teks. Tulis \"alasan\" dalam bahasa Indonesia, satu kalimat pendek.\n" +
    "Aturan:\n" +
    "1. \"salah\" harus disalin persis dari teks, termasuk huruf besar dan tanda baca. Pilih bagian sependek mungkin yang masih jelas.\n" +
    "2. \"saran\" adalah pengganti untuk \"salah\" saja, bukan seluruh kalimat.\n" +
    "3. \"jenis\" harus salah satu dari: ejaan, grammar, pilihan kata, kalimat efektif, tanda baca.\n" +
    "4. Jika kesalahan yang sama muncul lebih dari sekali, tulis setiap kemunculan.\n" +
    "5. Urutkan sesuai urutan kemunculan di teks.\n" +
    "6. Jangan ubah gaya penulis kalau tidak ada kesalahan nyata.\n" +
    "7. Jika tidak ada kesalahan, kembalikan daftar kosong.\n";
  if (bentuk === "array") {
    p += "Format balasan: hanya satu array JSON, tanpa markdown dan tanpa teks lain. " +
         "Setiap item punya kunci salah, saran, alasan, jenis. Jika tidak ada kesalahan, balas [].\n";
  } else if (bentuk === "objek") {
    p += "Format balasan: hanya satu objek JSON berbentuk {\"temuan\": [ ... ]}. " +
         "Setiap item di temuan punya kunci salah, saran, alasan, jenis. Jika tidak ada kesalahan, balas {\"temuan\": []}.\n";
  }
  return p + "Teks:\n" + teks;
}

async function panggilGemini(key, model, prompt, pakaiSkema) {
  var konfig = { temperature: 0.1 };
  if (pakaiSkema) {
    konfig.responseMimeType = "application/json";
    konfig.responseSchema = {
      type: "ARRAY",
      items: {
        type: "OBJECT",
        properties: {
          salah: { type: "STRING" },
          saran: { type: "STRING" },
          alasan: { type: "STRING" },
          jenis: { type: "STRING" }
        },
        required: ["salah", "saran", "alasan"]
      }
    };
  }
  var data = await kirim(GEMINI_BASE + "models/" + encodeURIComponent(model) + ":generateContent", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": key },
    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: konfig })
  });
  var cand = data && data.candidates && data.candidates[0];
  if (!cand || !cand.content || !cand.content.parts) {
    var sebab = (data && data.promptFeedback && data.promptFeedback.blockReason) || (cand && cand.finishReason) || "tidak diketahui";
    throw new Error("Respons kosong. Alasan: " + sebab);
  }
  return cand.content.parts.filter(function (p) { return !p.thought; })
    .map(function (p) { return p.text || ""; }).join("");
}

async function panggilOpenAI(key, model, prompt) {
  var data = await kirim(OPENAI_BASE + "chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
    body: JSON.stringify({
      model: model,
      messages: [
        { role: "system", content: "Kamu editor bahasa yang teliti. Balas hanya dengan JSON." },
        { role: "user", content: prompt }
      ],
      response_format: { type: "json_object" }
    })
  });
  var ch = data && data.choices && data.choices[0];
  if (!ch || !ch.message || !ch.message.content) throw new Error("Respons kosong dari OpenAI.");
  return ch.message.content;
}

function ambilArray(txt) {
  var t = String(txt).trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
  var obj;
  try {
    obj = JSON.parse(t);
  } catch (e) {
    var a = t.indexOf("["), b = t.lastIndexOf("]");
    var c = t.indexOf("{"), d = t.lastIndexOf("}");
    try {
      if (a >= 0 && b > a) obj = JSON.parse(t.slice(a, b + 1));
      else if (c >= 0 && d > c) obj = JSON.parse(t.slice(c, d + 1));
    } catch (e2) { obj = undefined; }
  }
  if (obj === undefined) throw new Error("Format balasan model tidak bisa dibaca. Coba model lain.");
  if (Array.isArray(obj)) return obj;
  if (obj && Array.isArray(obj.temuan)) return obj.temuan;
  return [];
}

async function tanya(prov, key, model, teks) {
  var isi;
  if (prov === "openai") {
    isi = await panggilOpenAI(key, model, buatPrompt(teks, "objek"));
  } else if (/^gemma/i.test(model)) {
    isi = await panggilGemini(key, model, buatPrompt(teks, "array"), false);
  } else {
    try {
      isi = await panggilGemini(key, model, buatPrompt(teks, "skema"), true);
    } catch (e) {
      if (!butuhTanpaJson(e)) throw e;
      isi = await panggilGemini(key, model, buatPrompt(teks, "array"), false);
    }
  }

  return ambilArray(isi).filter(function (t) {
    return t && typeof t.salah === "string" && typeof t.saran === "string" &&
      t.salah.length > 0 && t.salah.length <= 250 &&
      t.salah.indexOf("\n") < 0 && t.salah !== t.saran;
  });
}

async function tanyaDenganUlang(prov, key, model, teks) {
  var jeda = [0, 2000, 5000];
  var err;
  for (var i = 0; i < jeda.length; i++) {
    if (jeda[i]) {
      status("Server sibuk. Mencoba lagi (" + i + " dari 2)...");
      await tunggu(jeda[i]);
    }
    try {
      return await tanya(prov, key, model, teks);
    } catch (e) {
      err = e;
      if (KODE_SIBUK.indexOf(e.kode) < 0) throw e;
    }
  }
  throw err;
}

// ---------- Daftar model ----------
async function cariModel() {
  var key = $("key").value.trim();
  if (!key) { status("Isi API key dulu.", "err"); return; }
  status("Mengambil daftar model...");
  try {
    var nama = [];
    if (provAktif === "openai") {
      var d1 = await kirim(OPENAI_BASE + "models", { headers: { "Authorization": "Bearer " + key } });
      nama = ((d1 && d1.data) || []).map(function (m) { return m.id; })
        .filter(function (n) { return /^(gpt|o[0-9]|chatgpt)/.test(n); })
        .filter(function (n) { return !/audio|realtime|image|tts|transcribe|embed|moderation|search|whisper|dall|instruct|computer-use|codex/.test(n); });
    } else {
      var d2 = await kirim(GEMINI_BASE + "models?pageSize=200", { headers: { "x-goog-api-key": key } });
      nama = ((d2 && d2.models) || [])
        .filter(function (m) { return (m.supportedGenerationMethods || []).indexOf("generateContent") >= 0; })
        .map(function (m) { return m.name.replace(/^models\//, ""); })
        .filter(function (n) { return !/tts|image|live|audio|embedding|robotics|veo|imagen|vision|computer-use|antigravity|deep-research|learnlm|aqa/.test(n); });
    }
    nama.sort(function (a, b) {
      var ga = /^gemini/.test(a) ? 0 : 1;
      var gb = /^gemini/.test(b) ? 0 : 1;
      if (ga !== gb) return ga - gb;
      return a < b ? -1 : 1;
    });
    if (nama.length === 0) { status("Tidak ada model yang cocok untuk key ini.", "err"); return; }

    var sebelum = $("model").value;
    isiModel(nama, nama.indexOf(sebelum) >= 0 ? sebelum : nama[0]);
    simpanLokal(kList(provAktif), JSON.stringify(nama));
    simpanSaatIni();
    status("Ditemukan " + nama.length + " model. Pilih salah satu di kolom Model.", "ok");
  } catch (e) {
    status(e.message, "err");
  }
}

// ---------- Teks dan posisi di dokumen ----------
async function ambilTeks() {
  var teks = "";
  await Word.run(async function (context) {
    var sel = context.document.getSelection();
    sel.load("text");
    await context.sync();
    var r = sel;
    if (!sel.text || sel.text.trim().length < 3) {
      r = sel.paragraphs.getFirst();
      r.load("text");
      await context.sync();
    }
    teks = r.text;
  });
  return teks.replace(/[\r\u0007\u000b]/g, "\n");
}

function hitung(teks, cari) {
  var n = 0, p = 0;
  if (!cari) return 0;
  while ((p = teks.indexOf(cari, p)) >= 0) { n++; p += cari.length; }
  return n;
}

function adaBatas(teks, i, panjang) {
  var huruf = /[\p{L}\p{N}]/u;
  var sebelum = i > 0 ? teks.charAt(i - 1) : "";
  var sesudah = (i + panjang) < teks.length ? teks.charAt(i + panjang) : "";
  if (sebelum && huruf.test(sebelum)) return false;
  if (sesudah && huruf.test(sesudah)) return false;
  return true;
}

// Potongan teks di sekitar kata, dipakai untuk mencari posisinya lagi saat tombol diklik
function buatKonteks(teks, pos, salah) {
  var lebar = Math.max(0, Math.min(30, Math.floor((250 - salah.length) / 2)));
  var b = teks.slice(Math.max(0, pos - lebar), pos);
  var a = teks.slice(pos + salah.length, pos + salah.length + lebar);
  var nb = b.lastIndexOf("\n");
  if (nb >= 0) b = b.slice(nb + 1);
  var na = a.indexOf("\n");
  if (na >= 0) a = a.slice(0, na);
  var daftar = [];
  if (b && a) daftar.push({ teks: b + salah + a, k: hitung(b, salah) });
  if (b) daftar.push({ teks: b + salah, k: hitung(b, salah) });
  if (a) daftar.push({ teks: salah + a, k: 0 });
  return daftar;
}

function petakan(teks, items) {
  var hasil = [];
  var posisiTerakhir = {};
  items.forEach(function (it) {
    var satuKata = /^[\p{L}\p{N}]+$/u.test(it.salah);
    var p = posisiTerakhir[it.salah] || 0;
    var pos = -1;
    while ((p = teks.indexOf(it.salah, p)) >= 0) {
      if (!satuKata || adaBatas(teks, p, it.salah.length)) { pos = p; break; }
      p += 1;
    }
    if (pos < 0) return;
    posisiTerakhir[it.salah] = pos + it.salah.length;
    it.ctx = buatKonteks(teks, pos, it.salah);
    it.selesai = false;
    hasil.push(it);
  });
  return hasil;
}

function esc(s) { return s.replace(/\^/g, "^^"); }

async function cariRange(context, f) {
  var body = context.document.body;
  for (var i = 0; i < f.ctx.length; i++) {
    var c = f.ctx[i];
    try {
      var h1 = body.search(esc(c.teks), { matchCase: true });
      h1.load("items");
      await context.sync();
      if (h1.items.length === 0) continue;
      var h2 = h1.items[0].search(esc(f.salah), { matchCase: true });
      h2.load("items");
      await context.sync();
      if (h2.items.length > c.k) return h2.items[c.k];
      if (h2.items.length > 0) return h2.items[0];
    } catch (e) { /* coba potongan berikutnya */ }
  }
  try {
    var h3 = body.search(esc(f.salah), { matchCase: true });
    h3.load("items");
    await context.sync();
    if (h3.items.length === 1) return h3.items[0];
  } catch (e) {}
  return null;
}

// ---------- Alur pemeriksaan ----------
async function periksa() {
  if (sibuk) return;
  var key = $("key").value.trim();
  var model = $("model").value;
  if (!key) { $("setelan").open = true; status("Isi API key dulu.", "err"); return; }
  if (!model) { $("setelan").open = true; status("Pilih model dulu. Klik Cari model.", "err"); return; }
  simpanSaatIni();

  sibuk = true;
  $("cek").disabled = true;
  $("aksi").style.display = "none";
  $("hasil").innerHTML = "";
  temuan = [];
  try {
    status("Membaca teks dari dokumen...");
    var teks = await ambilTeks();
    if (!teks || teks.trim().length < 5) { status("Teks terlalu pendek atau kosong.", "err"); return; }
    if (teks.length > MAX_CHARS) {
      status("Teks terlalu panjang (" + teks.length + " karakter). Maksimal " + MAX_CHARS + ". Blok per bagian.", "err");
      return;
    }

    var urut = [model];
    if ($("auto").checked) {
      var opsi = $("model").options;
      for (var i = 0; i < opsi.length && urut.length < 4; i++) {
        if (opsi[i].value !== model) urut.push(opsi[i].value);
      }
    }

    var daftar, dipakai, terakhir;
    for (var j = 0; j < urut.length; j++) {
      status("Menunggu " + urut[j] + ". Word tetap bisa dipakai.");
      try {
        daftar = await tanyaDenganUlang(provAktif, key, urut[j], teks);
        dipakai = urut[j];
        break;
      } catch (e) {
        terakhir = e;
        if (!bolehPindah(e)) throw e;
      }
    }
    if (daftar === undefined) throw terakhir;

    var catatan = dipakai !== model ? " Model cadangan yang dipakai: " + dipakai + "." : "";
    if (daftar.length === 0) { status("Tidak ada kesalahan yang ditemukan." + catatan, "ok"); return; }

    temuan = petakan(teks, daftar);
    if (temuan.length === 0) {
      status("Model memberi saran, tapi teksnya tidak cocok dengan isi dokumen. Coba periksa ulang." + catatan, "err");
      return;
    }
    tampilkan();
    status("Ditemukan " + temuan.length + " temuan." + catatan, "info");
    $("aksi").style.display = "block";
  } catch (e) {
    status(e.message || String(e), "err");
  } finally {
    sibuk = false;
    $("cek").disabled = false;
  }
}

// ---------- Kartu hasil ----------
function pesanKartu(f, teks, err) {
  if (!f.pesan) {
    f.pesan = document.createElement("div");
    f.pesan.className = "pesan";
    f.kartu.appendChild(f.pesan);
  }
  f.pesan.style.color = err ? "#8a1f11" : "#1e5b2a";
  f.pesan.textContent = teks;
}

function tutup(f, ket) {
  f.selesai = true;
  f.kartu.className = "kartu selesai";
  f.tombol.forEach(function (b) { b.disabled = true; });
  pesanKartu(f, ket, false);
}

function tampilkan() {
  var wadah = $("hasil");
  wadah.innerHTML = "";
  temuan.forEach(function (f) {
    var kartu = document.createElement("div");
    kartu.className = "kartu";

    var jenis = document.createElement("div");
    jenis.className = "jenis";
    jenis.textContent = f.jenis || "perbaikan";
    kartu.appendChild(jenis);

    var baris = document.createElement("div");
    var s1 = document.createElement("span"); s1.className = "salah"; s1.textContent = f.salah;
    var s2 = document.createElement("span"); s2.textContent = "  menjadi  ";
    var s3 = document.createElement("span"); s3.className = "saran"; s3.textContent = f.saran;
    baris.appendChild(s1); baris.appendChild(s2); baris.appendChild(s3);
    kartu.appendChild(baris);

    var alasan = document.createElement("div");
    alasan.className = "alasan";
    alasan.textContent = f.alasan || "";
    kartu.appendChild(alasan);

    var tombol = document.createElement("div");
    tombol.className = "tombol";
    var bLihat = document.createElement("button"); bLihat.textContent = "Lihat";
    var bGanti = document.createElement("button"); bGanti.textContent = "Ganti";
    var bLewat = document.createElement("button"); bLewat.textContent = "Lewati";
    tombol.appendChild(bLihat); tombol.appendChild(bGanti); tombol.appendChild(bLewat);
    kartu.appendChild(tombol);

    f.kartu = kartu;
    f.tombol = [bLihat, bGanti, bLewat];
    f.pesan = null;

    bLihat.onclick = async function () {
      pesanKartu(f, "Mencari di dokumen...", false);
      try {
        var hasil = await lihat(f);
        if (hasil) pesanKartu(f, "Teks ditandai di dokumen.", false);
        else pesanKartu(f, "Teks tidak ditemukan lagi di dokumen. Mungkin sudah diubah.", true);
      } catch (e) {
        pesanKartu(f, "Gagal: " + (e.message || e), true);
      }
    };
    bGanti.onclick = async function () {
      pesanKartu(f, "Mengganti...", false);
      try {
        var hasil = await ganti(f);
        if (hasil) tutup(f, "Sudah diganti.");
        else pesanKartu(f, "Teks tidak ditemukan lagi di dokumen. Mungkin sudah diubah.", true);
      } catch (e) {
        pesanKartu(f, "Gagal: " + (e.message || e), true);
      }
    };
    bLewat.onclick = function () { tutup(f, "Dilewati."); };

    wadah.appendChild(kartu);
  });
}

async function lihat(f) {
  var ok = false;
  await Word.run(async function (context) {
    var r = await cariRange(context, f);
    if (r) {
      r.select("Select");
      await context.sync();
      ok = true;
    }
  });
  return ok;
}

async function ganti(f) {
  var ok = false;
  await Word.run(async function (context) {
    var r = await cariRange(context, f);
    if (r) {
      r.insertText(f.saran, "Replace");
      await context.sync();
      ok = true;
    }
  });
  return ok;
}

async function gantiSemua() {
  var gagal = 0, sukses = 0;
  $("semua").disabled = true;
  for (var i = 0; i < temuan.length; i++) {
    var f = temuan[i];
    if (f.selesai) continue;
    var ok = false;
    try { ok = await ganti(f); } catch (e) { ok = false; }
    if (ok) { tutup(f, "Sudah diganti."); sukses++; }
    else { pesanKartu(f, "Teks tidak ditemukan lagi di dokumen.", true); gagal++; }
  }
  $("semua").disabled = false;
  status(sukses + " diganti, " + gagal + " gagal diganti.", sukses > 0 ? "ok" : "err");
}
